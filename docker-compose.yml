# ==============================================================================
# Docker Compose - Appota NextGen Enterprise Secure RAG System
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend (Hybrid RAG Engine + Qdrant Vector DB + FlashRank)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: appota-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - ENABLE_HYBRID=${ENABLE_HYBRID:-true}
      - ENABLE_RERANK=${ENABLE_RERANK:-true}
      - SIMILARITY_TOP_K=${SIMILARITY_TOP_K:-5}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-15}
      - RERANK_TOP_K=${RERANK_TOP_K:-5}
    volumes:
      # Mount lưu trữ dữ liệu Qdrant để bảo toàn vector points
      - ./qdrant_db:/app/qdrant_db
      # Mount thư mục tài liệu chính sách công ty (Read-only)
      - ./data:/app/data:ro
      # Mount danh sách tài khoản người dùng
      - ./users.json:/app/users.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend (Enterprise Portal + Cross-User Testing Matrix)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appota-rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Kết nối nội bộ qua mạng Docker tới backend
      - APP_URL=http://backend:8000
      # Địa chỉ API khi truy cập từ trình duyệt người dùng bên ngoài
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: appota-rag-network
